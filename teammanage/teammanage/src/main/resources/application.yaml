# ====================================
# 파일: application.yaml (수정됨)
# 위치: src/main/resources/ (기존 파일 덮어쓰기)
# 기능: Spring Boot 앱 전체 설정
# ====================================
#
# 변경 내용:
# - spring.servlet.multipart 추가: 파일 업로드 크기 제한 설정
# - file.upload-dir 추가: 업로드 파일 저장 경로
# - H2 파일 모드로 변경: 서버 꺼도 데이터 유지

spring:
  # H2 데이터베이스 설정 (개발용 - 설치 없이 바로 사용 가능)
  datasource:
    url: jdbc:h2:file:./data/teammanage    # 파일 DB (서버 꺼도 데이터 유지!)
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 웹 콘솔 (브라우저에서 DB 내용을 직접 볼 수 있어!)
  # → http://localhost:8080/h2-console 에서 접속
  h2:
    console:
      enabled: true                # 콘솔 활성화
      path: /h2-console            # 접속 경로

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update             # 기존 데이터 유지하면서 테이블 변경사항만 반영
    show-sql: true                 # JPA가 만든 SQL을 콘솔에 보여줘
    # → 어떤 SQL이 실행되는지 공부할 수 있어!
    properties:
      hibernate:
        format_sql: true           # SQL을 보기 좋게 줄바꿈해서 보여줘

  # 파일 업로드 설정 (새로 추가)
  servlet:
    multipart:
      enabled: true                # 파일 업로드 기능 활성화
      max-file-size: 10MB          # 파일 하나당 최대 10MB
      max-request-size: 10MB       # 요청 전체 최대 10MB

# 서버 포트 (기본값이 8080이라 안 써도 되지만 명시적으로)
server:
  port: 8080

# 업로드 파일 저장 경로
file:
  upload-dir: uploads